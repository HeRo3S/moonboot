name: Hardware-Free Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  nix:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Build and run isolated checks
        run: nix flake check --print-build-logs
      - name: Build runnable package
        run: nix build --print-build-logs
      - name: Packaged CLI
        run: |
          ./result/bin/moonboot --help
          ./result/bin/moonboot --version
