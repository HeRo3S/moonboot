[package]
name = "moonboot"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
description = "A safety-first Tuya-to-Moonlight launcher for Wayland desktops"
license = "MIT"
repository = "https://github.com/HeRo3S/moonboot"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
eframe = { version = "=0.33.3", default-features = false, features = ["default_fonts", "glow", "wayland", "accesskit"] }
egui = "=0.33.3"
fs2 = "0.4"
hex = "0.4"
hmac = "0.12"
ksni = { version = "=0.3.6", features = ["blocking"] }
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
signal-hook = "0.3"
thiserror = "2"
tokio = { version = "1", features = ["rt", "time", "macros"] }
toml = "0.8"

[dev-dependencies]
egui_kittest = { version = "=0.33.3", default-features = false }
tempfile = "3"

[profile.release]
strip = true
